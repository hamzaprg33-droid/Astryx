<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="verify.pageTitle">Verifizierung – Astryx</title>
  <meta name="theme-color" content="#04050d">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h2 class="page-title" data-i18n="verify.title"></h2>
    <div class="panel" id="panel">
      <p data-i18n="verify.intro"></p>
      <ul>
        <li><span class="tag must" data-i18n="verify.required"></span><b data-i18n="verify.identify"></b><br><span data-i18n="verify.identifyDesc"></span></li>
        <li><span class="tag must" data-i18n="verify.required"></span><b data-i18n="verify.guilds"></b><br><span data-i18n="verify.guildsDesc"></span></li>
        <li><span class="tag rec" data-i18n="verify.recommended"></span><b data-i18n="verify.join"></b><br><span data-i18n="verify.joinDesc"></span></li>
      </ul>
      <label class="check">
        <input type="checkbox" id="agree">
        <span data-i18n-html="verify.agree"></span>
      </label>
      <div class="center">
        <button class="btn" id="go" disabled data-i18n="verify.button"></button>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
  <script>
    const { t, me, make } = Astryx;
    const agree = document.getElementById('agree');
    const go = document.getElementById('go');
    agree.addEventListener('change', () => (go.disabled = !agree.checked));
    go.addEventListener('click', () => {
      const tab = window.open('/api/verify', '_blank');
      if (!tab) location.href = '/api/verify';
      else go.textContent = t('verify.waiting');
    });

    let handled = false;
    const onAuth = (data) => {
      if (handled || !data || data.type !== 'astryx-auth') return;
      if (!data.ok) { go.textContent = t('verify.button'); return; }
      handled = true;
      location.href = `/${data.userId}/guilds`;
    };
    try { new BroadcastChannel('astryx-auth').onmessage = (e) => onAuth(e.data); } catch {}
    window.addEventListener('message', (e) => { if (e.origin === location.origin) onAuth(e.data); });

    me.then(u => {
      if (!u) return;
      document.getElementById('panel').replaceChildren(
        make('p', { className: 'center', textContent: t('verify.already') }),
        make('div', { className: 'center' }, make('a', { className: 'btn', href: `/${u.id}/guilds`, textContent: t('home.ctaServers') }))
      );
    });
  </script>
</body>
</html>
