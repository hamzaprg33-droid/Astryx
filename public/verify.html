<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification – Astryx</title>
  <link rel="stylesheet" href="/style.css?v=2">
  <script src="/i18n.js?v=2"></script>
</head>
<body data-title="verify">
  <main>
    <h2 class="page-title" data-i18n="title_verify"></h2>
    <div class="panel" id="panel">
      <p data-i18n="verify_intro"></p>
      <ul>
        <li><span class="tag must" data-i18n="tag_required"></span><b data-i18n="perm_profile_t"></b><br><span data-i18n="perm_profile_d"></span></li>
        <li><span class="tag must" data-i18n="tag_required"></span><b data-i18n="perm_guilds_t"></b><br><span data-i18n="perm_guilds_d"></span></li>
        <li><span class="tag must" data-i18n="tag_required"></span><b data-i18n="perm_join_t"></b><br><span data-i18n="perm_join_d"></span></li>
      </ul>
      <label class="check">
        <input type="checkbox" id="agree">
        <span data-i18n-html="verify_accept"></span>
      </label>
      <div class="center">
        <button class="btn" id="go" disabled data-i18n="verify_btn"></button>
      </div>
    </div>
  </main>
  <script src="/app.js?v=2"></script>
  <script>
    const agree = document.getElementById('agree');
    const go = document.getElementById('go');
    agree.addEventListener('change', () => (go.disabled = !agree.checked));
    go.addEventListener('click', () => (location.href = '/api/verify'));

    fetch('/api/me').then(r => (r.ok ? r.json() : null)).then(d => {
      if (!d || !d.user) return;
      const panel = document.getElementById('panel');
      panel.replaceChildren();
      const p = document.createElement('p');
      p.className = 'center';
      p.textContent = I18N.t('verify_done');
      const wrap = document.createElement('div');
      wrap.className = 'center';
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = `/${d.user.id}/guilds`;
      a.textContent = I18N.t('verify_home');
      const again = document.createElement('a');
      again.className = 'btn';
      again.style.marginLeft = '10px';
      again.href = '/api/verify';
      again.textContent = I18N.t('verify_again');
      wrap.append(a, again);
      panel.append(p, wrap);
    });
  </script>
</body>
</html>
