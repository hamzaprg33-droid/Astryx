<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astryx</title>
  <meta name="description" content="Astryx – der futuristische Discord Bot.">
  <meta name="theme-color" content="#04050d">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1 class="title" data-i18n="home.title">Astryx</h1>
    <p class="tagline" data-i18n="home.tagline"></p>
    <a class="btn" id="cta" href="/verify" data-i18n="home.cta"></a>
  </main>
  <script src="/app.js"></script>
  <script>
    Astryx.me.then(u => {
      if (!u) return;
      const cta = document.getElementById('cta');
      cta.href = `/${u.id}/guilds`;
      cta.textContent = Astryx.t('home.ctaServers');
    });
  </script>
</body>
</html>
